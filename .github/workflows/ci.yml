name: CI/CD Pipeline

on:
  push:
    branches:
      - "main"
      - "develop"
  pull_request:
    branches:
      - "main"
      - "develop"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # 1. Pruebas y Compilación del Core en C++ (CMake + Ninja + ctest)
  # ============================================================================
  build-and-test:
    name: Build & Test (C++20 / Ubuntu 24.04)
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar toolchain de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            autoconf automake libtool autoconf-archive python3 \
            curl zip unzip tar bison flex

      - name: Cache de vcpkg (herramientas + artefactos binarios)
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg
            ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Bootstrap de vcpkg
        run: |
          if [ ! -d "$VCPKG_ROOT/.git" ]; then
            git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          fi
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Configurar (CMake + vcpkg)
        run: |
          cmake --preset default -DECF_BUILD_TESTS=ON || {
            echo "=== VCPKG MANIFEST INSTALL LOG ==="
            cat build/vcpkg-manifest-install.log || true
            exit 1
          }

      - name: Compilar
        run: cmake --build build --parallel || cmake --build build -- -j 1 -k 0

      - name: Correr Tests
        run: ctest --test-dir build --output-on-failure

  # ============================================================================
  # 2. Auto-Merge de develop a main (solo en push a develop con pruebas exitosas)
  # ============================================================================
  automerge:
    name: Auto-Merge to main
    needs: build-and-test
    if: github.event_name == 'push' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge develop into main and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --no-ff develop -m "Auto-merge develop to main"
          git push origin main

  # ============================================================================
  # 3. Compilación y Publicación de Imagen Docker en GHCR (GitHub Container Registry)
  # ============================================================================
  build-docker:
    name: Build & Push Docker Image (GHCR)
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/saas-ecf-dgii-api
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 4. Despliegue Automático en VPS vía SSH
  # ============================================================================
  deploy-vps:
    name: Deploy C++ Engine to VPS
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy C++ Engine via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SERVER }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          script: |
            set -e
            CONTAINER_NAME="saas-ecf-dgii-api"
            IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/saas-ecf-dgii-api:latest"

            echo "Autenticando en GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "Descargando imagen C++..."
            docker pull "$IMAGE_NAME"

            echo "Deteniendo contenedor SaaS-Ecf DGII previo si existe..."
            docker stop "$CONTAINER_NAME" 2>/dev/null || true
            docker rm "$CONTAINER_NAME" 2>/dev/null || true

            echo "Iniciando contenedor C++ en red netbird con Traefik..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              --network netbird \
              -p 8086:8080 \
              --label "traefik.enable=true" \
              --label 'traefik.http.routers.saas-ecf-dgii.rule=Host(`dgii.app.vesismart.com`)' \
              --label "traefik.http.routers.saas-ecf-dgii.entrypoints=websecure" \
              --label "traefik.http.routers.saas-ecf-dgii.tls.certresolver=letsencrypt" \
              --label "traefik.http.services.saas-ecf-dgii.loadbalancer.server.port=8080" \
              -e ConnectionStrings__DefaultConnection="host=saas-ecf-postgres-db port=5432 dbname=saas_ecf_db user=ecf_user password=Ad@GxicRH@zFHTE\$4Sj" \
              -e ConnectionStrings__Redis="saas-ecf-redis-db:6379,password=R3d!s_SecUr3_P@ssw0rd2026" \
              -e REDIS_PASSWORD="R3d!s_SecUr3_P@ssw0rd2026" \
              -e WorkerSecretKey="6QG04PHsCO43eY9AOtGiI6c96nAUAQ9yIoIE6a0Ri2LQSpgxIQNdGvYVXWkvlEpAwR7ITkuD3j4-U0-9w8ipnQ" \
              -e WORKER_SECRET_KEY="6QG04PHsCO43eY9AOtGiI6c96nAUAQ9yIoIE6a0Ri2LQSpgxIQNdGvYVXWkvlEpAwR7ITkuD3j4-U0-9w8ipnQ" \
              -e JwtSettings__Secret="6QG04PHsCO43eY9AOtGiI6c96nAUAQ9yIoIE6a0Ri2LQSpgxIQNdGvYVXWkvlEpAwR7ITkuD3j4-U0-9w8ipnQ" \
              -e JWT_SECRET="6QG04PHsCO43eY9AOtGiI6c96nAUAQ9yIoIE6a0Ri2LQSpgxIQNdGvYVXWkvlEpAwR7ITkuD3j4-U0-9w8ipnQ" \
              -v /var/www/saas-ecf-dgii/certificates:/app/certificates \
              --restart unless-stopped \
              "$IMAGE_NAME"

            echo "Validando inicio..."
            sleep 3
            docker ps -f "name=$CONTAINER_NAME"

