name: CI/CD Pipeline

on:
  push:
    branches:
      - "main"
      - "develop"
  pull_request:
    branches:
      - "main"
      - "develop"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # 1. Pruebas y Compilación del Core en C++ (CMake + Ninja + ctest)
  # ============================================================================
  build-and-test:
    name: Build & Test (C++20 / Ubuntu 24.04)
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar toolchain de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            autoconf automake libtool autoconf-archive python3 \
            curl zip unzip tar bison flex

      - name: Cache de vcpkg (herramientas + artefactos binarios)
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg
            ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Bootstrap de vcpkg
        run: |
          if [ ! -d "$VCPKG_ROOT/.git" ]; then
            git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          fi
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Configurar (CMake + vcpkg)
        run: |
          cmake --preset default -DECF_BUILD_TESTS=ON || {
            echo "=== VCPKG MANIFEST INSTALL LOG ==="
            cat build/vcpkg-manifest-install.log || true
            exit 1
          }

      - name: Compilar
        run: cmake --build build --parallel || cmake --build build -- -j 1 -k 0

      - name: Correr Tests
        run: ctest --test-dir build --output-on-failure

  # ============================================================================
  # 2. Auto-Merge de develop a main (solo en push a develop con pruebas exitosas)
  # ============================================================================
  automerge:
    name: Auto-Merge to main
    needs: build-and-test
    if: github.event_name == 'push' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge develop into main and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --no-ff develop -m "Auto-merge develop to main"
          git push origin main

  # ============================================================================
  # 3. Compilación y Publicación de Imagen Docker en GHCR (GitHub Container Registry)
  # ============================================================================
  build-docker:
    name: Build & Push Docker Image (GHCR)
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/saas-ecf-dgii-api
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 4. Despliegue Automático en VPS vía SSH
  # ============================================================================
  deploy-vps:
    name: Deploy C++ Engine to VPS
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Extraer variables desde Secret ENV
        env:
          RAW_ENV_SECRET: ${{ secrets.ENV }}
        run: |
          python3 - <<'PYEOF'
          import os, base64

          raw = os.environ.get("RAW_ENV_SECRET", "")
          parsed = {}
          current_key = None
          current_val = []
          in_block = False

          if raw.strip():
              for line in raw.splitlines():
                  stripped = line.strip()
                  if not stripped:
                      continue
                  if not in_block and stripped.startswith("#"):
                      continue
                  if in_block:
                      current_val.append(line)
                      if "-----END " in line:
                          in_block = False
                      continue
                  if "=" in line and not line.startswith(" ") and not line.startswith("\t"):
                      if current_key:
                          parsed[current_key] = "\n".join(current_val)
                      parts = line.split("=", 1)
                      current_key = parts[0].strip()
                      val = parts[1].strip()
                      current_val = [val]
                      if "-----BEGIN " in val:
                          in_block = True
                  else:
                      if current_key:
                          current_val.append(line)

              if current_key:
                  parsed[current_key] = "\n".join(current_val)

          def clean(v, default=""):
              if v is None:
                  return default
              v = v.strip()
              if (v.startswith('"') and v.endswith('"')) or (v.startswith("'") and v.endswith("'")):
                  v = v[1:-1]
              return v

          db_name = clean(parsed.get('POSTGRES_DB'), 'saas_ecf_db')
          db_user = clean(parsed.get('POSTGRES_USER'), 'ecf_user')
          db_pass = clean(parsed.get('POSTGRES_PASSWORD'))
          redis_pass = clean(parsed.get('REDIS_PASSWORD'))
          jwt_secret = clean(parsed.get('JWT_SECRET'))
          worker_key_id = clean(parsed.get('WORKER_KEY_ID') or parsed.get('WorkerKeyId'), 'saas-ecf-backend-worker')
          worker_secret = clean(parsed.get('WORKER_SECRET_KEY') or parsed.get('WorkerSecretKey')) or jwt_secret

          dgii_env = f"""ConnectionStrings__DefaultConnection=Host=ecf-postgres-db;Port=5432;Database={db_name};Username={db_user};Password={db_pass}
          ConnectionStrings__Redis=saas-ecf-redis-db:6379,password={redis_pass}
          REDIS_PASSWORD={redis_pass}
          WorkerKeyId={worker_key_id}
          WORKER_KEY_ID={worker_key_id}
          WorkerSecretKey={worker_secret}
          WORKER_SECRET_KEY={worker_secret}
          JwtSettings__Secret={jwt_secret}
          JWT_SECRET={jwt_secret}
          """
          dgii_clean = "\n".join([line.strip() for line in dgii_env.strip().splitlines()]) + "\n"
          dgii_b64 = base64.b64encode(dgii_clean.encode('utf-8')).decode('ascii')

          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a", encoding="utf-8") as f:
                  for k, v in parsed.items():
                      clean_v = clean(v)
                      if clean_v:
                          print(f"::add-mask::{clean_v}")
                      delimiter = f"DELIMITER_{k}"
                      f.write(f"{k}<<{delimiter}\n{clean_v}\n{delimiter}\n")
                  if dgii_b64:
                      print(f"::add-mask::{dgii_b64}")
                  f.write(f"DGII_ENV_BASE64<<DELIMITER_DGII\n{dgii_b64}\nDELIMITER_DGII\n")
              print(f"Extracted and masked {len(parsed)} variables into GITHUB_ENV along with DGII_ENV_BASE64.")
          PYEOF

      - name: Deploy C++ Engine via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.HOSTINGER_SERVER || secrets.HOSTINGER_SERVER }}
          username: ${{ env.HOSTINGER_USERNAME || secrets.HOSTINGER_USERNAME || 'root' }}
          key: ${{ env.HOSTINGER_SSH_KEY || secrets.HOSTINGER_SSH_KEY }}
          password: ${{ env.HOSTINGER_PASSWORD || secrets.HOSTINGER_PASSWORD }}
          port: ${{ env.HOSTINGER_SSH_PORT || secrets.HOSTINGER_SSH_PORT || 22 }}
          script: |
            set -e
            CONTAINER_NAME="saas-ecf-dgii-api"
            REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_NAME="ghcr.io/${REPO_OWNER}/saas-ecf-dgii-api:latest"
            DEPLOY_DIR="/var/www/saas-ecf-dgii"

            mkdir -p "$DEPLOY_DIR/certificates"

            echo "Asegurando red Docker netbird..."
            if ! docker network inspect netbird >/dev/null 2>&1; then
              docker network create netbird
            fi

            echo "Asegurando base de datos saas_ecf_db en PostgreSQL..."
            docker exec ecf-postgres-db psql -U ecf_user -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'saas_ecf_db'" | grep -q 1 || \
            docker exec ecf-postgres-db psql -U ecf_user -d postgres -c "CREATE DATABASE saas_ecf_db OWNER ecf_user;"

            echo "Asegurando contenedor dedicado saas-ecf-redis-db..."
            if ! docker ps -q -f "name=^/saas-ecf-redis-db$" | grep -q .; then
              docker stop saas-ecf-redis-db 2>/dev/null || true
              docker rm saas-ecf-redis-db 2>/dev/null || true
              docker run -d \
                --name saas-ecf-redis-db \
                --network netbird \
                -p 127.0.0.1:6380:6379 \
                --restart unless-stopped \
                redis:7-alpine redis-server --requirepass "${REDIS_PASSWORD:-R3d!s_SecUr3_P@ssw0rd2026}"
            fi

            echo "Autenticando en GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "Descargando imagen C++..."
            docker pull "$IMAGE_NAME"

            echo "Escribiendo configuración .env..."
            if [ -n "${{ env.DGII_ENV_BASE64 }}" ]; then
              echo "${{ env.DGII_ENV_BASE64 }}" | base64 -d > "$DEPLOY_DIR/.env"
            fi
            chmod 600 "$DEPLOY_DIR/.env"

            # Detectar si hay saas-ecf-postgres-db o saas-ecf-redis-db dedicados
            if docker ps -q -f "name=^/saas-ecf-postgres-db$" | grep -q .; then
              sed -i 's/Host=ecf-postgres-db/Host=saas-ecf-postgres-db/g' "$DEPLOY_DIR/.env"
            fi
            if docker ps -q -f "name=^/saas-ecf-redis-db$" | grep -q .; then
              sed -i 's/ecf-redis-db:6379/saas-ecf-redis-db:6379/g' "$DEPLOY_DIR/.env"
            fi

            echo "Deteniendo contenedor SaaS-Ecf DGII previo si existe..."
            docker stop "$CONTAINER_NAME" 2>/dev/null || true
            docker rm "$CONTAINER_NAME" 2>/dev/null || true

            echo "Iniciando contenedor C++ en red netbird con Traefik..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              --network netbird \
              -p 127.0.0.1:8086:8080 \
              --label "traefik.enable=true" \
              --label 'traefik.http.routers.saas-ecf-dgii.rule=Host(`dgii.app.vesismart.com`) && PathPrefix(`/fe/`)' \
              --label "traefik.http.routers.saas-ecf-dgii.entrypoints=websecure" \
              --label "traefik.http.routers.saas-ecf-dgii.tls.certresolver=letsencrypt" \
              --label "traefik.http.services.saas-ecf-dgii.loadbalancer.server.port=8080" \
              --env-file "$DEPLOY_DIR/.env" \
              -v "$DEPLOY_DIR/certificates:/app/certificates" \
              --restart unless-stopped \
              "$IMAGE_NAME"

            echo "Validando inicio..."
            sleep 3
            docker ps -f "name=$CONTAINER_NAME"
            docker logs "$CONTAINER_NAME" --tail 30

            echo "✅ Despliegue de SaaS-Ecf DGII C++ completado exitosamente."
